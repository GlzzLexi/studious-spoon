name: Auto-Update Org Release Discussion

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'

jobs:
  update-org-discussion:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_DISCUSSION_TOKEN }}
      TZ: 'Asia/Manila'
      ORG_NAME: "GlzzLexi"
      DISCUSSION_NUMBER: "1"

    steps:
      - name: Calculate Next Release Window & Update Org Discussion
        run: |
          # 1. Calculate the +5 to +7 day window (e.g., Oct 14 -> Oct 19 - Oct 21)
          SHORT_START=$(date -d "+5 days" +"%b %-d")
          SHORT_END=$(date -d "+7 days" +"%b %-d")
          
          LONG_START=$(date -d "+5 days" +"%B %-d")
          LONG_END=$(date -d "+7 days" +"%B %-d, %Y")

          TITLE_WINDOW="${SHORT_START} –${SHORT_END}"
          BODY_WINDOW="${LONG_START} –${LONG_END}"

          echo "New Title Window: ${TITLE_WINDOW}"
          echo "New Body Window:  ${BODY_WINDOW}"

          # 2. Fetch the GraphQL Node ID of the Org Discussion
          #    Organization Discussions live inside the org's designated discussion repo,
          #    so we search across the org's repositories for Discussion #1.
          DISCUSSION_ID=$(gh api graphql \
            -F org="$ORG_NAME" \
            -F number="$DISCUSSION_NUMBER" \
            -f query='
              query($org: String!,$number: Int!) {
                organization(login: $org) {
                  repositories(first: 50, orderBy: {field: UPDATED_AT, direction: DESC}) {
                    nodes {
                      discussion(number: $number) {
                        id
                        title
                      }
                    }
                  }
                }
              }
            ' --jq '[.data.organization.repositories.nodes[].discussion | select(. != null)][0].id')

          if [ -z "$DISCUSSION_ID" ] \vert{}\vert{} [ "$DISCUSSION_ID" = "null" ]; then
            echo "Error: Could not find Discussion #${DISCUSSION_NUMBER} in Org${ORG_NAME}"
            exit 1
          fi

          echo "Found Discussion Node ID: ${DISCUSSION_ID}"

          # 3. Build the new Title and Body
          NEW_TITLE="📢 Project Roadmap & Modular Releases (Target: ${TITLE_WINDOW})"

          read -r -d '' NEW_BODY << EOF || true
          Hey everyone! 👋

          Welcome to **studious-spoon**. As part of building out the foundation for **GlzzLexi Studios**, I’ll be periodically rolling out open-source, modular Luau tools and starter systems straight from our development pipeline.

          ### 📦 Release Cadence
          Because I’m balancing production and independent development, updates will ship incrementally:
          - **Scope:** Expect **1 to 2 focused, production-ready modules** per release batch (e.g., custom state managers, network wrappers, or gameplay controller templates).
          - **Philosophy:** Clean, plug-and-play code that you can drop into \`ReplicatedStorage\` or \`ServerScriptService\` with zero bloat.

          ### 🗓️ Next Release Window
          - **Target Dates:** **${BODY_WINDOW}** *(subject to active development bandwidth)*
          - **Focus:** Polishing the core data handlers and initial scoring/state loops before pushing them to \`main\`.

          Drop your suggestions or feedback below on what types of modular tools or game systems you’d like to see prioritized next! 🚀
          EOF

          # 4. Update the Org Discussion via GraphQL Mutation
          gh api graphql \
            -f discussionId="$DISCUSSION_ID" \
            -f title="$NEW_TITLE" \
            -f body="$NEW_BODY" \
            -f query='
              mutation($discussionId: ID!, $title: String!,$body: String!) {
                updateDiscussion(input: {
                  discussionId: $discussionId,
                  title: $title,
                  body: $body
                }) {
                  discussion {
                    url
                  }
                }
              }
            '
