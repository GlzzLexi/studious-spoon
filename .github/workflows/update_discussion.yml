name: Auto-Update Org Release Discussion

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.github/**'
      - 'Company/**'
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-org-discussion:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.ORG_DISCUSSION_TOKEN }}
      ORG_NAME: "GlzzLexi"
      REPO_NAME: "studious-spoon"
      DISCUSSION_NUMBER: "1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run Discussion Synchronizer
        run: python3 .github/scripts/update_discussion.py
